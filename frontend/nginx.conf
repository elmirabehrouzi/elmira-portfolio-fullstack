server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 12M;


  location /api/ {
    proxy_pass https://elmira-portfolio-fullstack-production.up.railway.app/api/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 120s;
  }


  location /media/ {
    proxy_pass https://elmira-portfolio-fullstack-production.up.railway.app/media/;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }


  location /static/ {
    proxy_pass https://elmira-portfolio-fullstack-production.up.railway.app/static/;
  }


  location /django-admin/ {
    proxy_pass https://elmira-portfolio-fullstack-production.up.railway.app/django-admin/;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }


  location / {
    try_files $uri $uri/ /index.html;
  }
}

location /media/ {
    proxy_pass http://backend:8000/media/;
    proxy_set_header Host $host;
}