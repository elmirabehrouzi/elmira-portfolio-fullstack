server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nginx defaults to 1 MB request bodies. Portfolio uploads are allowed
  # up to 10 MB by Django, so leave a little multipart overhead here.
  client_max_body_size 12M;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    # Preserve the browser host + port (for example localhost:3000).
    # Django uses this when it builds absolute media URLs after uploads.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /media/ {
    proxy_pass http://backend:8000/media/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    proxy_pass http://backend:8000/static/;
  }

  location /django-admin/ {
    proxy_pass http://backend:8000/django-admin/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
